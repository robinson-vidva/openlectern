name = "openlectern"
main = "src/index.js"
compatibility_date = "2026-09-05"

# Serve the built React app (repo-root dist/) as static assets, with /api/* (and
# the /api/session/:code/ws WebSocket) handled by the Worker. Unknown paths fall
# back to index.html for the hash-routed SPA. One origin, no CORS.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The session Durable Object. SQLite-backed classes are available on the free
# Workers plan and never pause on inactivity -- they go dormant and are recreated
# on demand with their storage intact.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# The custom domain is attached in the Cloudflare dashboard (Workers -> this
# Worker -> Domains & Routes), which provisions DNS + HTTPS automatically because
# askdevotions.com is a zone on this account. The app is same-origin, so it works
# on both the workers.dev URL and the custom domain with no rebuild.
