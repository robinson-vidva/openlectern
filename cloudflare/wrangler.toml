name = "openlectern"
main = "src/index.js"
compatibility_date = "2026-09-05"

# The built app's files (repo-root dist/: hashed JS/CSS, icons, bible JSON) are
# static assets. The HTML shell is NOT an asset: `npm run build` moves it into the
# Worker (src/shell.generated.js), which serves it for / and every non-file path
# with the security headers. In production the asset layer serves existing files
# without invoking the Worker, and run_worker_first / _headers did not take
# effect, so this is the only way every HTML document carries the headers.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = true

# The session Durable Object. SQLite-backed classes are available on the free
# Workers plan and never pause on inactivity -- they go dormant and are recreated
# on demand with their storage intact.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

# Per-IP fixed-window limiter for session creation (anti-abuse).
[[durable_objects.bindings]]
name = "RATELIMIT"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiterDO"]

# Bot protection for session creation (Cloudflare Turnstile).
#   - TURNSTILE_SITE_KEY: the widget's public site key (the app reads it from
#     /api/config at runtime, so changing it needs no rebuild).
#   - TURNSTILE_HOSTNAMES: comma-separated hostnames a token may be solved on.
#     Tokens from any other host are refused. Never list localhost in production.
#   - TURNSTILE_SECRET: the widget's secret, stored as a Worker secret (not here):
#         npx wrangler secret put TURNSTILE_SECRET
#     The gate is skipped until the secret exists, so a deploy without it still works.
# Local dev against `wrangler dev`: use a .dev.vars file with the always-pass test
# pair (site key 1x00000000000000000000AA, secret 1x0000000000000000000000000000000AA)
# and TURNSTILE_HOSTNAMES=localhost.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAE7wkjc8WmGtmET-"
TURNSTILE_HOSTNAMES = "openlectern.askdevotions.com"

# The custom domain is attached in the Cloudflare dashboard (Workers -> this
# Worker -> Domains & Routes), which provisions DNS + HTTPS automatically because
# askdevotions.com is a zone on this account. The app is same-origin, so it works
# on both the workers.dev URL and the custom domain with no rebuild.
