name: Deploy Worker

# Deploys the Cloudflare Worker + Durable Object in cloudflare/. Runs on pushes
# that touch the backend. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an "Edit Cloudflare Workers" token (covers Durable Objects)
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
