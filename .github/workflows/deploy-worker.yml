name: Deploy Worker

# Builds the React app and deploys it together with the API Worker + Durable
# Object in cloudflare/ (the Worker serves the app and /api on one origin).
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an "Edit Cloudflare Workers" token (covers Durable Objects)
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# Optional:
#   TURNSTILE_SECRET      - the Turnstile widget's secret key. When set, every
#                           deploy pushes it to the Worker as a Worker secret (the
#                           Worker reads it at runtime; GitHub only delivers it).
#                           When unset, the step is skipped and the bot gate stays off.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the app (same-origin backend, served at domain root)
        run: npm run build
        env:
          VITE_API_BASE: same-origin
          BASE_PATH: /
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
      - name: Set the Turnstile secret on the Worker
        if: env.TURNSTILE_SECRET != ''
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Piped over stdin so the value never appears in arguments or the log.
        run: printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@4 secret put TURNSTILE_SECRET
