name: Deploy Worker

# Builds the React app and deploys it together with the API Worker + Durable
# Object in cloudflare/ (the Worker serves the app and /api on one origin).
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an "Edit Cloudflare Workers" token (covers Durable Objects)
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the app (same-origin backend)
        run: npm run build
        env:
          VITE_API_BASE: same-origin
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
