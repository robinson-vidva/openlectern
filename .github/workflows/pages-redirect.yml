name: Retire GitHub Pages site

# The app now lives on the Cloudflare Worker. The old GitHub Pages site still
# held a stale build wired to a retired backend, so this publishes a one-page
# redirect in its place (old links keep working, hash route included). Runs when
# the redirect page changes or by hand. To remove the Pages site entirely, set
# Settings -> Pages -> Source to "None" and delete this workflow.
on:
  push:
    branches: [main]
    paths: ['pages-redirect/**', '.github/workflows/pages-redirect.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
